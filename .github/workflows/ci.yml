name: CI

on:
  push:
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
          cache: true
          cache-dependency-path: '**/*.csproj'
      - name: Formatting
        run: dotnet format web.slnf --verify-no-changes --severity warn
      - name: Test
        run: dotnet test Blazor.WorkflowEditor.Tests/Blazor.WorkflowEditor.Tests.csproj -c Release -warnaserror
      - name: Build Web
        run: dotnet build web.slnf -c Release -warnaserror
